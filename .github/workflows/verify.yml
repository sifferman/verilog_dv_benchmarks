name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Prebuilt rv32i toolchain (matches what picorv32, nerv, and many other
  # small RISC-V cores expect for firmware builds).
  RISCV32_TOOLCHAIN_URL: https://github.com/stnolting/riscv-gcc-prebuilt/releases/download/rv32i-131023/riscv32-unknown-elf.gcc-13.2.0.tar.gz

jobs:
  VerifyAll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system + Python dependencies
        run: |
          # libbit-vector-perl: required by chipsalliance/Cores-VeeR-EL2 configs/veer.config.
          sudo apt-get install -y python3-dev libbit-vector-perl
          pip3 install -r requirements.txt
          # FuseSoC (.core-driven builds, used by olofk/serv, pulp-platform, ...)
          pip3 install fusesoc
          # cocotb + cocotb-test for Make-based and pytest-based cocotb testbenches
          pip3 install "cocotb<2" cocotb-test cocotbext-axi cocotbext-eth cocotbext-pcie cocotbext-uart cocotbext-i2c

      - name: Install HDL tools (oss-cad-suite, sv2v, verible)
        run: |
          wget -O - https://raw.githubusercontent.com/sifferman/hdl-tool-installer/main/install | bash -s -- . --oss-cad-suite --zachjs-sv2v
          echo "$GITHUB_WORKSPACE/oss-cad-suite/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/zachjs-sv2v" >> $GITHUB_PATH
          # verible-verilog-preprocessor strip-comments — used by the sandbox
          # scrub to remove SV comments without mangling string literals.
          VERIBLE_URL=$(curl -sL https://api.github.com/repos/chipsalliance/verible/releases/latest \
            | python3 -c "import json,sys; [print(a['browser_download_url']) for a in json.load(sys.stdin)['assets'] if 'linux-static-x86_64' in a['name']]")
          mkdir -p "$GITHUB_WORKSPACE/verible"
          curl -sSL "$VERIBLE_URL" | tar -xz -C "$GITHUB_WORKSPACE/verible" --strip-components=1
          echo "$GITHUB_WORKSPACE/verible/bin" >> $GITHUB_PATH
          # Make-based cocotb testbenches (e.g. alexforencich/verilog-axi) load
          # vvp from oss-cad-suite, which links the bundled Python 3.11 — not
          # the system Python. The bundled cocotb 2.x discovers tests by
          # importing test modules that do `import cocotb_test.simulator` at
          # module scope (used for their pytest entry points). Install the
          # shim packages into oss-cad-suite's Python so the import succeeds.
          "$GITHUB_WORKSPACE/oss-cad-suite/bin/tabbypy3" -m pip install --no-deps \
            cocotb-test cocotb-bus \
            cocotbext-axi cocotbext-eth cocotbext-pcie cocotbext-uart cocotbext-i2c

      - name: Install riscv32-unknown-elf toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/riscv32"
          wget -qO- "$RISCV32_TOOLCHAIN_URL" | tar -xz -C "$RUNNER_TEMP/riscv32"
          echo "$RUNNER_TEMP/riscv32/bin" >> $GITHUB_PATH

      - name: Verify toolchain availability
        run: |
          which iverilog verilator yosys sv2v fusesoc riscv32-unknown-elf-gcc verible-verilog-preprocessor
          iverilog -V | head -1
          fusesoc --version
          riscv32-unknown-elf-gcc --version | head -1

      - run: make verify-all WORKERS=1

      # Sandbox layer: build a self-contained sandbox per problem, run its
      # `verify` wrapper, and require the buggy RTL state to produce a
      # non-zero exit. This catches sandbox regressions (missing sibling
      # clone, broken scrub, .git leakage, etc.) that `verify-all` doesn't.
      - run: make test-sandboxes-all WORKERS=1

      - run: make clean-logs
